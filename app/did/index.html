
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DiD Interactive Lab</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Ubuntu, sans-serif;
  margin: 2rem;
  max-width: 960px;
}
.panel {
  border: 1px solid #ddd;
  padding: 1rem;
  margin-bottom: 1.5rem;
  border-radius: 6px;
}
button {
  margin-right: 0.5rem;
  padding: 0.4rem 0.8rem;
  font-weight: 600;
}
input[type="range"] { width: 100%; }
.status {
  font-weight: bold;
  padding: 0.5rem;
  border-radius: 4px;
  display: inline-block;
}
.ok { background-color: #e6f4ea; color: #137333; }
.warning { background-color: #fef7e0; color: #a05a00; }
svg { background: #fafafa; border: 1px solid #ddd; }
.note {
  font-size: 0.9rem;
  color: #555;
  margin-top: 0.5rem;
}
.authoritative {
  margin-top: 0.75rem;
  font-size: 0.95rem;
  font-weight: 600;
}
</style>
</head>

<body>

<h1>Difference-in-Differences — Interactive Lab</h1>

<div class="panel">
<button onclick="setMode('guided')">Guided (A–B–C–D)</button>
<button onclick="setMode('explore')">Explore (slider)</button>
</div>

<div class="panel" id="guidedPanel">
<button onclick="setStage(1)">A</button>
<button onclick="setStage(2)">B</button>
<button onclick="setStage(3)">C</button>
<button onclick="setStage(4)">D</button>
</div>

<div class="panel" id="explorePanel" style="display:none;">
<label>True pre-trend difference (unobserved)</label>
<input type="range" id="pretrend" min="-2" max="2" step="0.1" value="0">
<div>Current value: <span id="val">0</span></div>
</div>

<div class="panel">
<svg id="plot" width="720" height="320"></svg>
</div>

<div class="panel" id="statusPanel" style="display:none;">
<div id="diagnostic" class="status ok">
✅ Approximately parallel (small deviations)
</div>
<div class="note">
Parallel trends is a theoretical identification assumption about the pre-intervention period.
</div>
<div id="authoritative" class="authoritative" style="display:none;">
Visual diagnostics are suggestive, not conclusive.
</div>
</div>

<script>
const svg = document.getElementById("plot");
const diag = document.getElementById("diagnostic");
const statusPanel = document.getElementById("statusPanel");
const auth = document.getElementById("authoritative");
const slider = document.getElementById("pretrend");
const val = document.getElementById("val");

let mode = "guided";
let stage = 1;
let pretrend = 0;

const T = [...Array(11).keys()].map(d => d - 5);

function scaleX(t){ return 50 + (t + 5) * 60; }
function scaleY(y){ return 270 - y * 40; }

function drawLine(data, color, opacity=1){
  const path = data.map((d,i) =>
    (i===0 ? "M" : "L") + scaleX(d.t) + "," + scaleY(d.y)
  ).join(" ");
  return `<path d="${path}" fill="none" stroke="${color}"
               stroke-width="2" opacity="${opacity}"/>`;
}

function drawTreatmentLine(){
  const x = scaleX(0);
  return `
    <line x1="${x}" y1="30" x2="${x}" y2="290"
          stroke="#555" stroke-dasharray="4,4"/>
    <text x="${x + 5}" y="40" font-size="12" fill="#555">
      Treatment
    </text>`;
}

function drawEffectArrow(){
  const x = scaleX(0);
  const y0 = scaleY(0);
  const y1 = scaleY(1);
  return `
    <line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}"
          stroke="#000" stroke-width="2"
          marker-end="url(#arrow)"/>
    <text x="${x + 5}" y="${(y0 + y1)/2}"
          font-size="12" fill="#000">+1</text>`;
}

function render(){
  svg.innerHTML = `
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10"
              refX="5" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
      </marker>
    </defs>
  `;

  const control = T.map(t => ({t, y: 0.2 * t}));
  const treated = T.map(t => ({
    t,
    y: t < 0
      ? 0.2 * t + (mode === "explore" ? pretrend * t : 0)
      : 0.2 * t + 1
  }));

  const faded = mode === "guided" && stage === 1;

  svg.innerHTML += drawLine(control, "#1f77b4", faded ? 0.6 : 1);
  svg.innerHTML += drawLine(treated, "#d62728", faded ? 0.6 : 1);

  if (mode === "guided" && stage >= 2){
    svg.innerHTML += drawTreatmentLine();
  }

  if (
    (mode === "guided" && stage >= 3) ||
    mode === "explore"
  ){
    svg.innerHTML += drawEffectArrow();
    statusPanel.style.display = "block";
  } else {
    statusPanel.style.display = "none";
  }

  if (mode === "guided" && stage === 4){
    auth.style.display = "block";
  } else {
    auth.style.display = "none";
  }

  if (mode === "explore"){
    if (Math.abs(pretrend) < 0.3){
      diag.textContent = "✅ Approximately parallel (small deviations)";
      diag.className = "status ok";
    } else {
      diag.textContent = "⚠️ Parallel trends clearly violated";
      diag.className = "status warning";
    }
  }
}

function setStage(s){
  stage = s;
  render();
}

function setMode(m){
  mode = m;
  document.getElementById("guidedPanel").style.display =
    m === "guided" ? "block" : "none";
  document.getElementById("explorePanel").style.display =
    m === "explore" ? "block" : "none";
  render();
}

slider.addEventListener("input", () => {
  pretrend = parseFloat(slider.value);
  val.textContent = pretrend.toFixed(1);
  render();
});

render();
</script>

</body>
</html>
