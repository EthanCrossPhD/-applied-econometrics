
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staggered Adoption & TWFE Failure</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Ubuntu, sans-serif;
  margin: 2rem;
  max-width: 960px;
}
.panel {
  border: 1px solid #ddd;
  padding: 1rem;
  margin-bottom: 1.5rem;
  border-radius: 6px;
}
button {
  margin-right: 0.5rem;
  padding: 0.4rem 0.8rem;
  font-weight: 600;
}
.status {
  font-weight: bold;
  padding: 0.5rem;
  border-radius: 4px;
  display: inline-block;
}
.ok { background-color: #e6f4ea; color: #137333; }
.warning { background-color: #fef7e0; color: #a05a00; }
svg { background: #fafafa; border: 1px solid #ddd; }
.note {
  font-size: 0.9rem;
  color: #555;
  margin-top: 0.5rem;
}
.authoritative {
  margin-top: 0.75rem;
  font-size: 0.95rem;
  font-weight: 600;
}
</style>
</head>

<body>

<h1>Staggered Adoption — Why TWFE Can Fail</h1>

<div class="panel">
<button onclick="setView('true')">True Treatment Effects</button>
<button onclick="setView('twfe')">What TWFE Estimates</button>
</div>

<div class="panel">
<svg id="plot" width="720" height="340"></svg>
</div>

<div class="panel">
<div id="diagnostic" class="status ok">
✅ Group-time effects are well-defined
</div>
<div class="note" id="explanation">
Each cohort has a constant treatment effect of +1 after adoption.
</div>
<div class="authoritative">
TWFE implicitly compares treated units to already-treated units under staggered adoption.
</div>
</div>

<script>
const svg = document.getElementById("plot");
const diag = document.getElementById("diagnostic");
const expl = document.getElementById("explanation");

let view = "true";

// cohorts with different adoption times
const cohorts = [
  {name: "A", g: 0, color: "#1f77b4"},
  {name: "B", g: 2, color: "#2ca02c"},
  {name: "C", g: 4, color: "#d62728"}
];

const T = [...Array(9).keys()].map(d => d - 2);

function scaleX(t){ return 60 + (t + 2) * 70; }
function scaleY(y){ return 280 - y * 60; }

function drawLine(data, color){
  const path = data.map((d,i) =>
    (i===0 ? "M" : "L") + scaleX(d.t) + "," + scaleY(d.y)
  ).join(" ");
  return `<path d="${path}" fill="none" stroke="${color}"
               stroke-width="2"/>`;
}

function render(){
  svg.innerHTML = `
    <line x1="40" y1="280" x2="700" y2="280" stroke="#000"/>
    <line x1="40" y1="40" x2="40" y2="280" stroke="#000"/>
  `;

  cohorts.forEach(c => {
    const data = T.map(t => {
      let y;

      if (view === "true"){
        y = t < c.g ? 0 : 1;
      } else {
        // TWFE distortion: later cohorts serve as controls
        y = t < c.g ? 0 : (c.g === 0 ? 0.4 : c.g === 2 ? 0.2 : -0.1);
      }

      return {t, y};
    });

    svg.innerHTML += drawLine(data, c.color);

    svg.innerHTML += `
      <text x="${scaleX(c.g)+4}" y="50"
            font-size="12" fill="${c.color}">
        Cohort ${c.name}
      </text>
      <line x1="${scaleX(c.g)}" y1="40"
            x2="${scaleX(c.g)}" y2="280"
            stroke="${c.color}" stroke-dasharray="4,4"/>
    `;
  });

  if (view === "twfe"){
    diag.textContent = "⚠️ TWFE mixes comparisons across treated cohorts";
    diag.className = "status warning";
    expl.textContent =
      "Although true effects are constant (+1), TWFE produces attenuated or even negative estimates.";
  } else {
    diag.textContent = "✅ Group-time treatment effects are constant";
    diag.className = "status ok";
    expl.textContent =
      "Each cohort experiences the same treatment effect after adoption.";
  }
}

function setView(v){
  view = v;
  render();
}

render();
</script>

</body>
</html>
