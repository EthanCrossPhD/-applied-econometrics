
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Placebo (Lead) Test — Event Study</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Ubuntu, sans-serif;
  margin: 2rem;
  max-width: 960px;
}
.panel {
  border: 1px solid #ddd;
  padding: 1rem;
  margin-bottom: 1.5rem;
  border-radius: 6px;
}
input[type="range"] { width: 100%; }
.status {
  font-weight: bold;
  padding: 0.5rem;
  border-radius: 4px;
  display: inline-block;
}
.ok { background-color: #e6f4ea; color: #137333; }
.warning { background-color: #fdecea; color: #b00020; }
svg { background: #fafafa; border: 1px solid #ddd; }
.note {
  font-size: 0.9rem;
  color: #555;
  margin-top: 0.5rem;
}
.authoritative {
  margin-top: 0.75rem;
  font-size: 0.95rem;
  font-weight: 600;
}
</style>
</head>

<body>

<h1>Placebo (Lead) Test — Event Study</h1>

<div class="panel">
<label>Anticipation / placebo effect before treatment</label>
<input type="range" id="anticipation" min="0" max="0.5" step="0.05" value="0">
<div>Current value: <span id="val">0</span></div>
</div>

<div class="panel">
<svg id="plot" width="720" height="340"></svg>
</div>

<div class="panel">
<div id="diagnostic" class="status ok">
✅ No placebo effects detected
</div>
<div class="note" id="explanation">
Pre-treatment coefficients are approximately zero.
</div>
<div class="authoritative">
Placebo tests can falsify causal designs, not validate them.
</div>
</div>

<script>
const svg = document.getElementById("plot");
const slider = document.getElementById("anticipation");
const val = document.getElementById("val");
const diag = document.getElementById("diagnostic");
const expl = document.getElementById("explanation");

let anticipation = 0;

// relative time -5 ... +5
const K = [...Array(11).keys()].map(d => d - 5);

function scaleX(k){ return 70 + (k + 5) * 55; }
function scaleY(y){ return 280 - y * 120; }

function render(){
  svg.innerHTML = `
    <line x1="50" y1="280" x2="700" y2="280" stroke="#000"/>
    <line x1="50" y1="40" x2="50" y2="280" stroke="#000"/>
    <line x1="${scaleX(0)}" y1="40" x2="${scaleX(0)}" y2="280"
          stroke="#555" stroke-dasharray="4,4"/>
    <text x="${scaleX(0)+4}" y="55" font-size="12">Treatment</text>
  `;

  let placeboDetected = false;

  K.forEach(k => {
    if (k === -1) return;

    let beta;
    if (k < 0){
      beta = anticipation * (Math.abs(k) / 5);
      if (beta > 0.1) placeboDetected = true;
    } else {
      beta = 0.8;
    }

    const se = 0.1;
    const cx = scaleX(k);

    // CI
    svg.innerHTML += `
      <line x1="${cx}" y1="${scaleY(beta - 1.96*se)}"
            x2="${cx}" y2="${scaleY(beta + 1.96*se)}"
            stroke="#000"/>
    `;

    // point
    svg.innerHTML += `
      <circle cx="${cx}" cy="${scaleY(beta)}"
              r="4" fill="#1f77b4"/>
      <text x="${cx-6}" y="300" font-size="11">${k}</text>
    `;
  });

  if (placeboDetected){
    diag.textContent = "❌ Placebo effects detected — design invalid";
    diag.className = "status warning";
    expl.textContent =
      "Non-zero lead coefficients indicate anticipation or confounding.";
  } else {
    diag.textContent = "✅ No placebo effects detected";
    diag.className = "status ok";
    expl.textContent =
      "Pre-treatment coefficients are approximately zero.";
  }
}

slider.addEventListener("input", () => {
  anticipation = parseFloat(slider.value);
  val.textContent = anticipation.toFixed(2);
  render();
});

render();
</script>

</body>
</html>
