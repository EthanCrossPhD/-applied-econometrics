<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Applied Econometrics Studio – Teacher Panel</title>
<style>
body { font-family: Arial, sans-serif; max-width: 960px; margin:auto; padding:20px; }
.section { border:1px solid #ccc; padding:15px; margin-bottom:20px; }
textarea { width:100%; height:140px; }
</style>
</head>

<body>

<h1>Applied Econometrics Studio</h1>
<p><em>Think like an applied econometrician.</em></p>

<div class="section">
<h3>Exam Mode</h3>
<select id="examMode">
<option value="random">Random</option>
<option value="fixed">Fixed</option>
</select>
</div>

<div class="section">
<h3>Scenario Pool</h3>
<label><input type="checkbox" value="E1" checked> E1</label>
<label><input type="checkbox" value="E2" checked> E2</label>
<label><input type="checkbox" value="E3"> E3</label>
</div>

<div class="section">
<h3>Duration</h3>
<input type="number" id="duration" value="20">
</div>

<button onclick="generate()">Generate Exam</button>
<p id="status"></p>

<textarea id="output"></textarea>

<script>
function generate() {

  var mode = document.getElementById("examMode").value;
  var duration = document.getElementById("duration").value;

  var pool = [];
  document.querySelectorAll("input[type=checkbox]:checked").forEach(
    cb => pool.push(cb.value)
  );

  if (pool.length === 0) {
    alert("Select at least one scenario.");
    return;
  }

  var html =
"<!DOCTYPE html>\n" +
"<html><head><meta charset=\"UTF-8\">\n" +
"<title>Applied Econometrics Studio – Exam</title></head>\n" +
"<body>\n" +
"<h2>Applied Econometrics Studio</h2>\n" +
"<p>Mode: " + mode + "</p>\n" +
"<p>Duration: " + duration + " minutes</p>\n" +
"<p>Allowed scenarios: " + pool.join(", ") + "</p>\n" +
"</body></html>";

  document.getElementById("output").value = html;
  document.getElementById("status").textContent =
    "✅ index.html generated.";

}
</script>

</body>
</html>
