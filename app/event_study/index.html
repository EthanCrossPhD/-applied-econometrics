
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event-Study Interactive Lab (Joint Pre-trend Test)</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Ubuntu, sans-serif;
  margin: 2rem;
  max-width: 960px;
}
.panel {
  border: 1px solid #ddd;
  padding: 1rem;
  margin-bottom: 1.5rem;
  border-radius: 6px;
}
input[type="range"] { width: 100%; }
.status {
  font-weight: bold;
  padding: 0.5rem;
  border-radius: 4px;
  display: inline-block;
}
.ok { background-color: #e6f4ea; color: #137333; }
.warning { background-color: #fef7e0; color: #a05a00; }
svg { background: #fafafa; border: 1px solid #ddd; }
.note {
  font-size: 0.9rem;
  color: #555;
  margin-top: 0.5rem;
}
.authoritative {
  margin-top: 0.75rem;
  font-size: 0.95rem;
  font-weight: 600;
}
</style>
</head>

<body>

<h1>Event-Study — Joint Pre-trend Test</h1>

<div class="panel">
<label>True pre-trend violation (unobserved)</label>
<input type="range" id="pretrend" min="-0.5" max="0.5" step="0.05" value="0">
<div>Current value: <span id="val">0</span></div>
</div>

<div class="panel">
<svg id="plot" width="720" height="340"></svg>
</div>

<div class="panel">
<div id="diagnostic" class="status ok">
✅ Fail to reject joint pre-trend test
</div>
<div id="stats" class="note">
Wald statistic = 0.00, p-value = 1.000
</div>
<div class="authoritative">
Joint pre-trend tests assess consistency with parallel trends, not proof of identification.
</div>
</div>

<script>
const svg = document.getElementById("plot");
const slider = document.getElementById("pretrend");
const val = document.getElementById("val");
const diag = document.getElementById("diagnostic");
const stats = document.getElementById("stats");

let pretrend = 0;

// relative time
const K = [...Array(11).keys()].map(d => d - 5);

function scaleX(k){ return 70 + (k + 5) * 55; }
function scaleY(y){ return 280 - y * 120; }

function render(){
  svg.innerHTML = `
    <line x1="50" y1="280" x2="700" y2="280" stroke="#000"/>
    <line x1="50" y1="40" x2="50" y2="280" stroke="#000"/>
    <line x1="${scaleX(0)}" y1="40" x2="${scaleX(0)}" y2="280"
          stroke="#555" stroke-dasharray="4,4"/>
    <text x="${scaleX(0)+4}" y="55" font-size="12">Treatment</text>
  `;

  let wald = 0;
  let df = 0;

  K.forEach(k => {
    if (k === -1) return;

    const beta =
      k < 0 ? pretrend * k : 0.8;

    const se = 0.08 + 0.03 * Math.abs(k);

    if (k < 0){
      wald += Math.pow(beta / se, 2);
      df += 1;
    }

    const cx = scaleX(k);
    const cy = scaleY(beta);

    svg.innerHTML += `
      <circle cx="${cx}" cy="${cy}" r="4" fill="#1f77b4"/>
      <text x="${cx-6}" y="300" font-size="11">${k}</text>
    `;
  });

  // stylized p-value from chi-square(df)
  const pval = Math.exp(-0.5 * wald);

  stats.textContent =
    "Wald statistic = " + wald.toFixed(2) +
    ", p-value = " + pval.toFixed(3);

  if (pval < 0.05){
    diag.textContent = "⚠️ Reject joint pre-trend test (p < 0.05)";
    diag.className = "status warning";
  } else {
    diag.textContent = "✅ Fail to reject joint pre-trend test";
    diag.className = "status ok";
  }
}

slider.addEventListener("input", () => {
  pretrend = parseFloat(slider.value);
  val.textContent = pretrend.toFixed(2);
  render();
});

render();
</script>

</body>
</html>
